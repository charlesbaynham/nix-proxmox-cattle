name: Build Proxmox LXC template

# Reusable. A conforming app repo calls this and needs nothing else in CI:
#
#   jobs:
#     lxc-template:
#       permissions:
#         contents: write
#       uses: charlesbaynham/nix-proxmox-cattle/.github/workflows/build-template.yml@v1
#
# `permissions` is the caller's to declare — a reusable workflow inherits the
# caller's token, and publishing a release needs contents: write.

on:
  workflow_call:
    inputs:
      attr:
        description: Flake attribute producing the template tarball.
        type: string
        default: proxmoxLxcTemplate
      release_branch:
        description: Branch whose builds are published as releases.
        type: string
        default: master
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Optional token with write access to the streetfight cache.
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: streetfight
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the template
        run: |
          set -o pipefail
          nix build ".#${{ inputs.attr }}" --print-build-logs
          built=$(echo result/tarball/*.tar.xz)
          test -f "$built"

          # The tarball's one nixos-system-* input, so consumers need no flake change.
          # Nix 2.34: inputs under `.inputs.drvs` (was `.inputDrvs`), store prefix dropped.
          mapfile -t toplevel_drvs < <(nix derivation show ".#${{ inputs.attr }}" | jq -r '
            (.derivations // .) | .[] | (.inputDrvs // .inputs.drvs) | keys[]
            | select(contains("-nixos-system-"))')
          [ "${#toplevel_drvs[@]}" -eq 1 ] || {
            echo "expected one nixos-system-* input derivation, found ${#toplevel_drvs[@]}: ${toplevel_drvs[*]}" >&2
            exit 1
          }
          toplevel_drv=${toplevel_drvs[0]}
          case "$toplevel_drv" in /*) ;; *) toplevel_drv="/nix/store/$toplevel_drv" ;; esac
          toplevel=$(readlink -f "$(nix-store --realise --add-root "$RUNNER_TEMP/toplevel" "$toplevel_drv")")
          hash=$(basename "$toplevel" | cut -c1-12)

          # ⚠️ Named by the closure, not the commit: an identical system keeps its
          # name and is not redeployed. The .closure.zst is for nix-store --import.
          stem="$(basename "$built" .tar.xz)-$hash"
          mkdir -p dist
          cp "$built" "dist/$stem.tar.xz"
          nix-store --export $(nix-store -qR "$toplevel") | zstd -T0 -9 -o "dist/$stem.closure.zst"
          printf '%s\n' "TEMPLATE_NAME=$stem.tar.xz" "CLOSURE_NAME=$stem.closure.zst" "TOPLEVEL=$toplevel" >>"$GITHUB_ENV"
          ls -lh dist/

      # Not on the release branch: the release assets below are the same files, and
      # artifacts (unlike release assets) are billed on a private repo.
      - uses: actions/upload-artifact@v4
        if: github.ref != format('refs/heads/{0}', inputs.release_branch)
        with:
          name: proxmox-lxc-template
          path: |
            dist/${{ env.TEMPLATE_NAME }}
            dist/${{ env.CLOSURE_NAME }}
          retention-days: 3

      - name: Publish as release assets
        if: github.ref == format('refs/heads/{0}', inputs.release_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="template-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          # A release per build of the release branch: rolling back means
          # redeploying an older generation, which needs its asset to still be
          # downloadable.
          gh release create "$tag" \
            --title "Proxmox LXC template $tag" \
            --notes "Proxmox LXC rootfs template built from ${GITHUB_SHA}."$'\n'"Toplevel: ${TOPLEVEL}" \
            --target "$GITHUB_SHA" \
            || echo "release $tag exists; uploading the assets to it"
          gh release upload "$tag" "dist/$TEMPLATE_NAME" "dist/$CLOSURE_NAME" --clobber
